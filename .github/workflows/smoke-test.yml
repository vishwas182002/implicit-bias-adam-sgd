name: Smoke Test

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile experiment scripts
        run: |
          python -m py_compile \
            exp1_margin/run_experiment1.py \
            exp2_mnist_patch/run_experiment2.py
